<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">Концепт интерфейса редактора субтитров</title>
  <desc id="desc">Тёмный фирменный экран с видеомонитором, поиском реплик, временными кодами, выделенной фразой и проверкой переноса строк.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#191a1d"/><stop offset="1" stop-color="#111215"/></linearGradient><linearGradient id="shot" x2=".8" y2="1"><stop stop-color="#24343a"/><stop offset=".58" stop-color="#7e7767"/><stop offset="1" stop-color="#1a1d1e"/></linearGradient></defs>
  <rect width="1440" height="780" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1438" height="778" rx="23" fill="none" stroke="#383a3d" stroke-width="2"/>
  <rect width="1440" height="76" rx="24" fill="#1c1d20"/><path d="M0 76h1440" stroke="#323438"/><rect x="28" y="20" width="36" height="36" rx="11" fill="#28241d" stroke="#bc9c5f"/><text x="77" y="42" fill="#e9e4db" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">КАДР &amp; СЕНС</text><text x="77" y="59" fill="#8e9093" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.5">РЕДАКТОР СУБТИТРОВ</text><text x="453" y="48" fill="#e8e4dc" font-family="Arial,sans-serif" font-size="15" font-weight="600">Острів проклятих · эссе</text><rect x="1282" y="19" width="126" height="38" rx="9" fill="#29251e" stroke="#806a42"/><text x="1312" y="44" fill="#e8c37d" font-family="Arial,sans-serif" font-size="11" font-weight="700">СОХРАНИТЬ</text>
  <rect x="26" y="99" width="524" height="650" rx="17" fill="#141619" stroke="#303237"/><text x="52" y="137" fill="#e8c37d" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.7">ПРЕДПРОСМОТР И РАЗБИВКА</text>
  <rect x="52" y="158" width="472" height="270" rx="10" fill="url(#shot)"/><path d="M52 336q85-49 157-11t135-38q80 13 180-27v168H52z" fill="#171a1b" opacity=".82"/><path d="M52 379q91-46 166-22t142-27q77 9 164-22v120H52z" fill="#111517" opacity=".83"/><circle cx="337" cy="256" r="23" fill="#172024"/><path d="M291 298q46-40 91-1l21 78q-69 26-134 0z" fill="#22282a"/>
  <text x="81" y="385" fill="#f4f0e8" font-family="Arial,sans-serif" font-size="15" font-weight="700">ВИ СКАЛІЧЕНІ, МАРШАЛ.</text>
  <text x="52" y="466" fill="#929498" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">ПРОВЕРКА ЧТЕНИЯ</text><rect x="52" y="482" width="472" height="61" rx="9" fill="#202226" stroke="#373a3e"/><text x="76" y="511" fill="#eeeae1" font-family="Arial,sans-serif" font-size="14" font-weight="700">Ви скалічені,</text><text x="76" y="532" fill="#eeeae1" font-family="Arial,sans-serif" font-size="14" font-weight="700">маршал.</text><text x="52" y="586" fill="#818388" font-family="Arial,sans-serif" font-size="10">2 строки · 18 символов в кадре</text>
  <rect x="52" y="618" width="472" height="1" fill="#303237"/><text x="52" y="652" fill="#e8c37d" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">ИЗМЕНЕНИЯ ВИДНЫ НА ПРЕДПРОСМОТРЕ</text><text x="52" y="684" fill="#96989c" font-family="Arial,sans-serif" font-size="10">Фраза, время и перенос связаны с исходным кадром.</text>
  <rect x="572" y="99" width="842" height="650" rx="17" fill="#141619" stroke="#303237"/><text x="600" y="137" fill="#eee9df" font-family="Arial,sans-serif" font-size="16" font-weight="700">Реплики эссе</text><text x="1315" y="137" fill="#909297" font-family="Arial,sans-serif" font-size="11">АКТ 04 / 08</text>
  <rect x="600" y="157" width="786" height="43" rx="8" fill="#202226" stroke="#373a3e"/><circle cx="620" cy="178" r="6" fill="none" stroke="#96989c" stroke-width="1.5"/><path d="m624 182 5 5" stroke="#96989c" stroke-width="1.5"/><text x="642" y="183" fill="#777a80" font-family="Arial,sans-serif" font-size="11">Найти фразу в эссе</text>
  <g font-family="Arial,sans-serif">
    <rect x="600" y="220" width="786" height="75" rx="9" fill="#191b1e" stroke="#2b2e32"/><text x="622" y="249" fill="#8d9094" font-family="monospace" font-size="10">01:26.4</text><text x="736" y="254" fill="#dedbd5" font-size="13">Біль головний.</text><text x="1357" y="254" text-anchor="end" fill="#8c8e91" font-size="10">АКТ 02</text><text x="622" y="277" fill="#75787d" font-size="10">Нажмите на строку, чтобы перейти к моменту в видео.</text>
    <rect x="600" y="310" width="786" height="86" rx="9" fill="#29251e" stroke="#c6a663" stroke-width="1.5"/><text x="622" y="341" fill="#e8c37d" font-family="monospace" font-size="10">02:02.8</text><text x="736" y="346" fill="#f0ece4" font-size="13" font-weight="700">Ви скалічені, маршал.</text><text x="1357" y="346" text-anchor="end" fill="#e8c37d" font-size="10" font-weight="700">АКТ 04 · ВЫБРАНО</text><rect x="736" y="363" width="502" height="19" rx="4" fill="#101114"/><text x="750" y="377" fill="#aaa8a4" font-size="9">Субтитр проверен в кадре · перейти к источнику ▶</text>
    <rect x="600" y="411" width="786" height="75" rx="9" fill="#191b1e" stroke="#2b2e32"/><text x="622" y="440" fill="#8d9094" font-family="monospace" font-size="10">03:18.1</text><text x="736" y="445" fill="#dedbd5" font-size="13">Я пытался убежать.</text><text x="1357" y="445" text-anchor="end" fill="#8c8e91" font-size="10">АКТ 04</text><text x="622" y="468" fill="#75787d" font-size="10">Украинский текст сохраняет интонацию реплики.</text>
    <rect x="600" y="501" width="786" height="75" rx="9" fill="#191b1e" stroke="#2b2e32"/><text x="622" y="530" fill="#8d9094" font-family="monospace" font-size="10">04:03.7</text><text x="736" y="535" fill="#dedbd5" font-size="13">Вам нельзя доверять памяти.</text><text x="1357" y="535" text-anchor="end" fill="#8c8e91" font-size="10">АКТ 04</text><text x="622" y="558" fill="#75787d" font-size="10">Поиск и фильтр помогают быстро найти нужную сцену.</text>
  </g>
  <rect x="600" y="612" width="786" height="1" fill="#303237"/><text x="600" y="652" fill="#929498" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.2">СЦЕНЫ · РЕПЛИКИ · ТАЙМКОДЫ · ПЕРЕНОС СТРОК</text><text x="600" y="689" fill="#777a7e" font-family="Arial,sans-serif" font-size="10">Фирменная схема редактора · не снимок экрана приложения</text>
</svg>
